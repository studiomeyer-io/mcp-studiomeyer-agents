# Dependabot config: npm only.
# This repo has package.json but no .github/workflows/* files,
# so github_actions updates would always fail (nothing to update).
# Keeping npm + ignoring github_actions silences the noise.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"
